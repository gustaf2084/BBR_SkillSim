name: Build EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Write VERSION from git tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "${GITHUB_REF#refs/tags/v}" > VERSION
          else
            echo "dev-${GITHUB_SHA::7}" > VERSION
          fi
          cat VERSION

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints-ci.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build with PyInstaller
        working-directory: src
        run: |
          python -m PyInstaller build_safe.spec --noconfirm

      - name: Package release zip
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src/dist/BBR_SkillSimulator.exe release/BBR_SkillSimulator.exe
          Copy-Item src/data.json, src/perk_trees.json, src/perk_i18n.json, VERSION release/
          # src/builds 为用户自定义流派目录,已被 .gitignore 排除;存在时才打包
          if (Test-Path src/builds) { Copy-Item -Recurse src/builds release/ }
          Copy-Item -Recurse src/icons release/
          Compress-Archive -Path release/* -DestinationPath "release/BBR_SkillSimulator-v$ver.zip"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBR_SkillSimulator
          path: release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/BBR_SkillSimulator-v*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
