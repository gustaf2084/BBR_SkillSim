name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt system dependencies (PySide6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints-ci.txt

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Type check (mypy)
        run: python -m mypy src

      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=long 2>&1 | tee pytest-output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload pytest output (diagnostics)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-output
          path: pytest-output.txt
